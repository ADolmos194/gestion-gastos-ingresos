<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ heading }}</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;background-color:#ffffff;border-radius:12px;border:1px solid #e4e4e7;">
            <tr>
              <td style="background-color:#18181b;padding:20px 32px;border-radius:12px 12px 0 0;">
                <span style="color:#ffffff;font-size:16px;font-weight:600;letter-spacing:.2px;">Gastos e Ingresos</span>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                <h1 style="margin:0 0 12px;font-size:20px;line-height:1.3;color:#18181b;">{{ heading }}</h1>
                <p style="margin:0 0 24px;font-size:14px;line-height:1.6;color:#52525b;">{{ intro }}</p>
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td align="center" style="padding-bottom:24px;">
                      <span style="display:inline-block;padding:14px 28px;font-size:30px;font-weight:700;letter-spacing:8px;color:#18181b;background-color:#f4f4f5;border-radius:8px;border:1px solid #e4e4e7;font-family:'Courier New',Courier,monospace;">{{ code }}</span>
                    </td>
                  </tr>
                </table>
                <p style="margin:0 0 8px;font-size:13px;color:#71717a;">Este código vence en {{ ttl_minutes }} minutos.</p>
                <p style="margin:0;font-size:13px;color:#71717a;">{{ footer_note }}</p>
              </td>
            </tr>
          </table>
          <p style="margin:16px 0 0;font-size:12px;color:#a1a1aa;">Gastos e Ingresos</p>
        </td>
      </tr>
    </table>
  </body>
</html>
