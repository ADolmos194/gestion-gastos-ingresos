# Hooks locales de pre-commit (instalar con: pre-commit install).
# El escaneo de secretos (gitleaks) corre también en CI (.github/workflows/ci.yml) — acá
# agarra los secretos ANTES de que lleguen a un commit en el repo local.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=5000"]