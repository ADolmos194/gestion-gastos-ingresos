# Locations compartidas entre el server HTTP (:80) y el HTTPS (:443, ver nginx.conf) —
# separadas en su propio archivo para no duplicar cada location al agregar TLS.

root /usr/share/nginx/html;
index index.html;

# api/, admin/ y static/ del backend viajan tal cual (sin URI en proxy_pass = nginx
# reenvía la ruta original completa) — Django ya espera esos prefijos en config/urls.py
# y STATIC_URL, no hay que reescribir nada acá.
# limit_req_zone api_global se define en nginx.conf; el burst permite ráfagas cortas de
# requests iguales (p.ej. varias pestañas) sin cortar a nadie, nodelay las deja pasar
# de una: solo la IP globalmente pasada de vueltas queda esperando/descartada.
location /api/ {
    limit_req zone=api_global burst=20 nodelay;
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Location exacta (no prefijo): nginx la prioriza sobre "location /admin/" de abajo para
# esta ruta puntual. Sin esto, alguien podría probar contraseñas del admin sin ningún
# límite — ver el comentario de limit_req_zone en nginx.conf.
location = /admin/login/ {
    limit_req zone=admin_login burst=3 nodelay;
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /admin/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Estáticos del admin de Django, servidos por Whitenoise desde el propio backend (ver
# config/settings.py) — nginx solo hace de proxy, no necesita un volumen compartido.
location /static/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
}

# SPA de React (react-router): cualquier ruta que no matcheó arriba y no es un archivo
# real del build cae a index.html, para que el router del lado del cliente la resuelva.
location / {
    # Cabeceras de seguridad: Django ya las manda en sus propias respuestas
    # (SecurityMiddleware/XFrameOptionsMiddleware, ver config/settings.py), pero esta
    # location sirve archivos directo desde nginx sin pasar por Django — sin esto, el
    # HTML/JS del SPA saldría sin ellas. A propósito DENTRO de location / (no en el
    # server{} de arriba): así no se duplican en las respuestas de /api//admin//static/,
    # que ya las traen del backend.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    # CSP del SPA (defensa en profundidad contra XSS). Sin 'unsafe-inline' en script-src:
    # el build de Vite/React no inyecta scripts inline (ver frontend/index.html). Se deja
    # 'unsafe-inline' solo en style-src porque shadcn/Base UI inyectan estilos dinámicos.
    # connect-src 'self' asume el default de VITE_URL_BASE="" (backend detrás de este mismo
    # nginx) — si algún día el backend queda en otro origen, agregar ese origen acá.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    try_files $uri $uri/ /index.html;
}
