# El login del admin de Django (/admin/login/) NO pasa por LoginView (nuestra vista
# custom de la API, con throttle de DRF + bloqueo de cuenta tras 3 intentos, ver
# apps/autenticacion/views.py) — usa el login estándar de Django, sin ningún límite de
# intentos propio. Sin esto, alguien podría probar credenciales sin freno contra el admin.
# zone=10m ~ 160k IPs distintas en memoria antes de reciclar las más viejas, de sobra acá.
limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;

server {
    listen 80;
    server_name _;

    # Los .xlsx de importación (ver cuentas/monedas/categorias import/) pueden superar el
    # 1m por defecto de nginx — sin esto, un archivo de plantilla con hojas grandes se
    # rechaza acá mismo, antes de que Django llegue a validarlo.
    client_max_body_size 20m;

    # Fuera de /etc/nginx/conf.d/ a propósito: esa carpeta se auto-incluye entera
    # (*.conf) a nivel http en la config base de la imagen — un archivo ahí con
    # "location" adentro rompería el arranque (location solo vale dentro de server{}).
    include /etc/nginx/locations.conf;
}

# HTTPS con certificado self-signed, generado en el build de la imagen (ver Dockerfile) —
# sirve para probar que la terminación TLS en nginx funciona de punta a punta (y para
# poder prender SECURE_PROXY_SSL_HEADER/cookies Secure del lado de Django, ver
# config/settings.py) mientras no haya un dominio real. El navegador va a mostrar la
# advertencia de certificado no confiable — es esperado, self-signed no lo evita.
#
# Cuando haya un dominio real: reemplazar ssl_certificate/ssl_certificate_key por los que
# emita certbot (Let's Encrypt no emite certificados para "localhost" ni IPs privadas, por
# eso acá es self-signed) y agregar un `return 301 https://$host$request_uri;` en el
# server de arriba (puerto 80) para forzar HTTPS — no se agregó ese redirect todavía para
# no romper el acceso por HTTP plano mientras se prueba esto en local.
server {
    listen 443 ssl;
    server_name _;

    client_max_body_size 20m;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Fuera de /etc/nginx/conf.d/ a propósito: esa carpeta se auto-incluye entera
    # (*.conf) a nivel http en la config base de la imagen — un archivo ahí con
    # "location" adentro rompería el arranque (location solo vale dentro de server{}).
    include /etc/nginx/locations.conf;
}
