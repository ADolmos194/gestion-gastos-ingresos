name: CI

# En cada push/PR: valida backend y frontend por separado (rápido, falla temprano), y solo
# si ambos pasan, construye las 3 imágenes de Docker (backend/worker comparten imagen,
# nginx incluye el build de frontend) para agarrar roturas de Dockerfile/nginx.conf antes de
# que lleguen a un deploy real.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # Mismo motor que producción/dev (Postgres real vía DATABASE_URL, ver config/settings.py)
    # — nada de sqlite acá, para no probar contra un motor distinto del que corre de verdad.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: qullqi_ci
          POSTGRES_USER: qullqi
          POSTGRES_PASSWORD: qullqi_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U qullqi -d qullqi_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-never-use-in-production
      DJANGO_DEBUG: "True"
      DATABASE_URL: postgresql://qullqi:qullqi_pass@localhost:5432/qullqi_ci
      # Ningún test llama a .delay() de verdad (ver apps.configuraciones.tasks) — Celery no
      # conecta al importar settings, así que no hace falta un Redis real en este job.
      CELERY_BROKER_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Tests
        run: python manage.py test

      # Los warnings W004/W008 (cookies/TLS) son esperados: sin un dominio real con
      # certbot en CI no se pueden activar, ver config/settings.py. Lo que importa acá es
      # que no aparezcan errores nuevos frente a DEBUG=False real (el job de arriba corre
      # con DJANGO_DEBUG=True para los tests).
      - name: Deploy checks (check --deploy)
        env:
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
          SESSION_COOKIE_SECURE: "False"
          CSRF_COOKIE_SECURE: "False"
        run: python manage.py check --deploy

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Type-check + build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

  # Corren en paralelo a backend/frontend (no bloquean el build ni dependen de él): son el
  # escaneo de secretos + las auditorías de dependencias. Aptas para fallar la PR cuando
  # aparece una advisory conocida o un secreto colado en el diff/history de git.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks analiza la history completa, no solo el último commit.
          fetch-depth: 0

      - name: Gitleaks (secret scan)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --report-format json --report-path gitleaks-report.json --no-banner --exit-code 1
          echo "Sin secretos detectados."

      # Sube el reporte como artifact aunque solo sea para revisión manual.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit (dependencias Python)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --disable-pip

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: pnpm audit (dependencias del frontend)
        run: pnpm install --frozen-lockfile && pnpm audit --prod --audit-level=high

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      # backend/Dockerfile corre collectstatic en el build (ver Dockerfile) — si algo ahí
      # rompe (un import, un STORAGES mal armado), esto lo agarra antes que un deploy.
      - name: Build backend/worker image
        run: docker build -f backend/Dockerfile -t ci-backend backend

      # Contexto "." (raíz), no "frontend/": nginx/Dockerfile necesita frontend/ para el
      # build multi-stage (ver nginx/Dockerfile) — mismo comando que usaría un deploy real.
      - name: Build nginx (+ frontend) image
        run: docker build -f nginx/Dockerfile -t ci-nginx .
